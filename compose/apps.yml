services:
  api-gateway-container:
    image: selimhorri/api-gateway-ecommerce-boot:0.1.0
    container_name: api-gateway-container
    ports: ["8080:8080"]
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_APPLICATION_NAME=api-gateway
      - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://service-discovery-container:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_CONFIG_IMPORT=optional:configserver:http://cloud-config-container:9296/
      - SPRING_CLOUD_CONFIG_URI=http://cloud-config-container:9296
      - SPRING_ZIPKIN_BASE_URL=http://zipkin-container:9411
      - SPRING_APPLICATION_JSON={"eureka":{"client":{"serviceUrl":{"defaultZone":"http://service-discovery-container:8761/eureka/"}},"instance":{"prefer-ip-address":true}}}
    networks: [ecommerce-net]
    depends_on: [service-discovery-container, cloud-config-container]

  proxy-client-container:
