apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-discovery
  namespace: dev
spec:
  replicas: 1
  selector: { matchLabels: { app: service-discovery } }
  template:
    metadata: { labels: { app: service-discovery } }
    spec:
      containers:
      - name: service-discovery
        image: santi1761/service-discovery-ecommerce-boot:0.1.0
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 8761 }]
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "dev"
        - name: SPRING_ZIPKIN_BASE_URL
          value: "http://zipkin.dev.svc.cluster.local:9411"
        readinessProbe:
          httpGet: { path: /, port: 8761 }
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: service-discovery
  namespace: dev
spec:
  selector: { app: service-discovery }
  ports: [{ port: 8761, targetPort: 8761 }]
  type: ClusterIP
