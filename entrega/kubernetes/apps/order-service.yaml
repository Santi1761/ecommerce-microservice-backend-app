apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: dev
spec:
  replicas: 1
  selector: { matchLabels: { app: order-service } }
  template:
    metadata: { labels: { app: order-service } }
    spec:
      containers:
      - name: order-service
        image: santi1761/order-service-ecommerce-boot:0.1.0
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 8300 }]
        env:
        - { name: SPRING_PROFILES_ACTIVE, value: "dev" }
        - { name: SPRING_APPLICATION_NAME, value: "order-service" }
        - { name: EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE, value: "http://service-discovery.dev.svc.cluster.local:8761/eureka/" }
        - { name: EUREKA_INSTANCE_PREFER_IP_ADDRESS, value: "true" }
        - { name: SPRING_CONFIG_IMPORT, value: "optional:configserver:http://cloud-config.dev.svc.cluster.local:9296/" }
        - { name: SPRING_CLOUD_CONFIG_URI, value: "http://cloud-config.dev.svc.cluster.local:9296" }
        - { name: SPRING_ZIPKIN_BASE_URL, value: "http://zipkin.dev.svc.cluster.local:9411" }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: dev
spec:
  selector: { app: order-service }
  ports: [{ port: 8300, targetPort: 8300 }]
  type: ClusterIP
