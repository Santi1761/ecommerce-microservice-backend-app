apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: dev
spec:
  replicas: 1
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
      - name: api-gateway
        image: santi1761/api-gateway-ecommerce-boot:0.1.0
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 8080 }]
        env:
        - { name: SPRING_PROFILES_ACTIVE, value: "dev" }
        - { name: SPRING_APPLICATION_NAME, value: "api-gateway" }
        - { name: EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE, value: "http://service-discovery.dev.svc.cluster.local:8761/eureka/" }
        - { name: EUREKA_INSTANCE_PREFER_IP_ADDRESS, value: "true" }
        - { name: SPRING_CONFIG_IMPORT, value: "optional:configserver:http://cloud-config.dev.svc.cluster.local:9296/" }
        - { name: SPRING_CLOUD_CONFIG_URI, value: "http://cloud-config.dev.svc.cluster.local:9296" }
        - { name: SPRING_ZIPKIN_BASE_URL, value: "http://zipkin.dev.svc.cluster.local:9411" }
        readinessProbe:
          httpGet: { path: /actuator/health, port: 8080 }
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: dev
spec:
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
  type: ClusterIP
