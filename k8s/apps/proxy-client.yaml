apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-client
  namespace: dev
spec:
  replicas: 1
  selector: { matchLabels: { app: proxy-client } }
  template:
    metadata: { labels: { app: proxy-client } }
    spec:
      containers:
      - name: proxy-client
        image: santi1761/proxy-client-ecommerce-boot:0.1.0
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 8900 }]
        env:
        - { name: SPRING_PROFILES_ACTIVE, value: "dev" }
        - { name: SPRING_APPLICATION_NAME, value: "proxy-client" }
        - { name: EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE, value: "http://service-discovery.dev.svc.cluster.local:8761/eureka/" }
        - { name: EUREKA_INSTANCE_PREFER_IP_ADDRESS, value: "true" }
        - { name: SPRING_CONFIG_IMPORT, value: "optional:configserver:http://cloud-config.dev.svc.cluster.local:9296/" }
        - { name: SPRING_CLOUD_CONFIG_URI, value: "http://cloud-config.dev.svc.cluster.local:9296" }
        - { name: SPRING_ZIPKIN_BASE_URL, value: "http://zipkin.dev.svc.cluster.local:9411" }
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-client
  namespace: dev
spec:
  selector: { app: proxy-client }
  ports: [{ port: 8900, targetPort: 8900 }]
  type: ClusterIP
