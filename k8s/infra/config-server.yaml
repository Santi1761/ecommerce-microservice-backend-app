apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-config
  namespace: dev
spec:
  replicas: 1
  selector: { matchLabels: { app: cloud-config } }
  template:
    metadata: { labels: { app: cloud-config } }
    spec:
      containers:
      - name: cloud-config
        image: santi1761/cloud-config-ecommerce-boot:0.1.0
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 9296 }]
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "dev"
        - name: SPRING_ZIPKIN_BASE_URL
          value: "http://zipkin.dev.svc.cluster.local:9411"
        # Si tu config-server necesita GIT_URI, agrega:
        # - name: SPRING_CLOUD_CONFIG_SERVER_GIT_URI
        #   value: "https://github.com/tu-org/tu-repo-config"
        readinessProbe:
          httpGet: { path: /actuator/health, port: 9296 }
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-config
  namespace: dev
spec:
  selector: { app: cloud-config }
  ports: [{ port: 9296, targetPort: 9296 }]
  type: ClusterIP
